<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><title>SVG → PNG 내보내기</title>
<style>body{font:14px -apple-system,'Apple SD Gothic Neo',sans-serif;padding:20px}li.ok{color:#2d6a35}li.err{color:#b00}</style></head>
<body>
<h1>SVG → PNG 내보내기</h1>
<p>data/media.json 의 모든 SVG를 원래 크기(작은 도식은 2배)로 PNG로 그려 build/png 에 저장합니다.</p>
<button id="go">내보내기 시작</button>
<p id="sum"></p>
<ol id="log"></ol>
<script type="module">
const log = document.getElementById('log');
async function svgToPng(url) {
  const img = new Image();
  img.decoding = 'sync';
  img.src = '/' + url + '?t=' + Date.now();
  await img.decode();
  const w = img.naturalWidth, h = img.naturalHeight;
  const scale = w < 800 ? 2 : 1; // 400px 개념 도식은 선명하게 2배
  const jpg = url.startsWith('media/plates/'); // 모델 도판: 바탕이 불투명 → JPEG(용량 약 1/3)
  const c = document.createElement('canvas');
  c.width = w * scale; c.height = h * scale;
  const g = c.getContext('2d');
  // 바탕을 칠하지 않음: 레이어·궤적처럼 겹쳐 보는 도식은 투명해야 함 (도판은 SVG 안에 자체 바탕이 있음)
  if (jpg) { g.fillStyle = '#FDFCF9'; g.fillRect(0, 0, c.width, c.height); }
  g.drawImage(img, 0, 0, c.width, c.height);
  const blob = await new Promise((r) => c.toBlob(r, jpg ? 'image/jpeg' : 'image/png', 0.86));
  const res = await fetch('/__export/' + url.replace(/\.svg$/, jpg ? '.jpg' : '.png'), { method: 'PUT', body: blob });
  if (!res.ok) throw new Error('저장 실패 ' + res.status);
  return [c.width, c.height, blob.size];
}
async function run() {
  const media = await fetch('/data/media.json').then((r) => r.json());
  const urls = [...new Set(media.map((m) => m.url).filter((u) => u.endsWith('.svg')))];
  let ok = 0;
  for (const u of urls) {
    const li = document.createElement('li');
    try {
      const [w, h, n] = await svgToPng(u);
      li.textContent = `${u} → ${w}×${h} (${Math.round(n / 1024)}KB)`;
      li.className = 'ok';
      ok += 1;
    } catch (e) {
      li.textContent = `${u} ✕ ${e.message}`;
      li.className = 'err';
    }
    log.append(li);
  }
  document.getElementById('sum').textContent = `완료 ${ok}/${urls.length}`;
  window.__exportDone = { ok, total: urls.length };
}
document.getElementById('go').addEventListener('click', run);
</script>
</body>
</html>
